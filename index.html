<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shukudu Kitchen - recipes refined through real cooking.">
  <meta name="theme-color" content="#4B241C">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shukudu Kitchen">
  <meta property="og:title" content="Shukudu Kitchen">
  <meta property="og:description" content="Recipes refined through real cooking.">
  <meta property="og:url" content="https://2harsharaj.github.io/shukudu-kitchen/">
  <meta property="og:image" content="https://2harsharaj.github.io/shukudu-kitchen/icons/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="806">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shukudu Kitchen">
  <meta name="twitter:description" content="Recipes refined through real cooking.">
  <meta name="twitter:image" content="https://2harsharaj.github.io/shukudu-kitchen/icons/social-preview.png">
  <title>Shukudu Kitchen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="stylesheet" href="style.css?v=1.19.5">
  <link rel="stylesheet" href="brand.css?v=1.15.1">
  <link rel="stylesheet" href="theme.css?v=1.19.5">
  <link rel="stylesheet" href="theme-toggle-fix.css?v=1.19.5">
  <link rel="stylesheet" href="homepage-filters.css?v=1.17.2">
  <script src="theme.js?v=1.15.1"></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header-row">
      <div class="brand-lockup site-header-copy">
        <img class="brand-icon" src="icons/icon-192.png" alt="" aria-hidden="true">
        <div>
          <p class="eyebrow">Personal cookbook</p>
          <h1>Shukudu Kitchen</h1>
          <p class="subtitle">Recipes refined through real cooking.</p>
        </div>
      </div>
      <div class="header-actions">
        <nav class="top-nav" aria-label="Primary navigation">
          <a class="nav-pill" href="current-meal.html" data-current-meal-link>Current Meal</a>
        </nav>
        <div class="theme-toggle-host" data-theme-toggle-host></div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="Recipe controls">
      <label>
        <span>Search recipes</span>
        <input id="searchInput" type="search" placeholder="Search by name or category">
      </label>

      <label>
        <span>Category</span>
        <select id="categoryFilter">
          <option value="all">All categories</option>
        </select>
      </label>
    </section>

    <section class="meal-filter-panel" aria-label="Meal type filters">
      <div>
        <p class="eyebrow">Meal type</p>
        <div id="mealTypeFilter" class="filter-chips" role="group" aria-label="Filter recipes by meal type"></div>
      </div>
    </section>

    <section>
      <div class="section-heading">
        <div>
          <p class="eyebrow">Finalized recipes</p>
          <h2>Cook from the collection</h2>
        </div>
        <p id="recipeCount" class="recipe-count"></p>
      </div>

      <div id="recipeGrid" class="recipe-grid" aria-live="polite"></div>
      <p id="emptyState" class="empty-state" hidden>No recipes match your search.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align: center;">Shukudu Kitchen &bull; <span data-site-version></span></div>
  </footer>

  <script src="site-version.js?v=1.19.5"></script>
  <script src="meal-state.js?v=1.19.4"></script>
  <script src="script.js?v=1.19.4"></script>
</body>
</html>
