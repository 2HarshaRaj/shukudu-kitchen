name: Validate Recipes

on:
  push:
    paths:
      - 'data/recipe-index.json'
      - 'data/recipes/**'
      - 'data/validation/**'
      - 'scripts/validate-recipes.js'
      - 'scripts/validate-produce-weights.js'
      - 'scripts/validate-search.js'
      - 'scripts/validate-recipe-pairings.js'
      - 'scripts/validate-theme.js'
      - 'docs/UI_THEME_STANDARD.md'
      - 'style.css'
      - 'brand.css'
      - 'theme.css'
      - 'theme-toggle-fix.css'
      - 'homepage-filters.css'
      - 'recipe-pairings.css'
      - 'recipe-scaling.css'
      - 'wake-lock.css'
      - 'index.html'
      - 'recipe.html'
      - '.github/workflows/validate-recipes.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate recipes
        run: node scripts/validate-recipes.js

      - name: Validate produce weights
        run: node scripts/validate-produce-weights.js

      - name: Validate search aliases
        run: node scripts/validate-search.js

      - name: Validate recipe pairings
        run: node scripts/validate-recipe-pairings.js

      - name: Validate theme rules
        run: node scripts/validate-theme.js
